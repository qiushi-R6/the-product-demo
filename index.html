<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>人生试衣间 | 产品 Demo</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="sections/today/today.css" />
    <link rel="stylesheet" href="sections/assessment/assessment.css" />
    <link rel="stylesheet" href="sections/experience/experience.css" />
    <link rel="stylesheet" href="sections/community/community.css" />
  </head>
  <body>
    <main class="shell">
      <section class="phone" aria-label="人生试衣间 App demo">
        <section class="entry-screen" id="entry-screen" aria-label="产品进入界面">
          <img
            src="Enter/output/night-stars-philosophy-elegant-text.png"
            alt="星空树影与人生哲理文字"
          />
          <button class="entry-action" type="button" id="entry-action">进入</button>
        </section>

        <section class="account-screen hidden" id="account-screen" aria-label="登录界面">
          <div class="account-illustration" aria-hidden="true">
            <div class="account-window">
              <span class="account-face"></span>
            </div>
            <span class="bird bird-left"></span>
            <span class="bird bird-right"></span>
            <span class="bird bird-low"></span>
          </div>

          <form class="account-card" id="account-form">
            <p class="account-kicker">寻光计划</p>
            <h2 id="account-title">Welcome</h2>

            <label class="account-field">
              <span class="account-icon">◎</span>
              <input type="text" id="account-username" name="username" autocomplete="username" placeholder="请输入用户名" />
            </label>

            <label class="account-field">
              <span class="account-icon">⌕</span>
              <input
                type="password"
                id="account-password"
                name="password"
                autocomplete="current-password"
                placeholder="请输入密码"
              />
            </label>

            <label class="agreement-row">
              <input type="checkbox" id="account-agreement" />
              <span>我已阅读并同意《用户协议》和《隐私政策》</span>
            </label>

            <p class="account-error" id="account-error" role="status"></p>

            <button class="account-submit" type="submit" id="account-submit">登录</button>

            <div class="account-links">
              <button type="button" id="account-register">注册账号</button>
              <button type="button" id="account-forgot">忘记密码</button>
            </div>
          </form>
        </section>

        <section class="persona-screen hidden" id="persona-screen" aria-label="用户画像问答界面">
          <div class="persona-orbit persona-orbit-one" aria-hidden="true"></div>
          <div class="persona-orbit persona-orbit-two" aria-hidden="true"></div>

          <div class="persona-quiz" id="persona-quiz">
            <div class="persona-quiz-head">
              <button class="persona-round" type="button" id="persona-back" aria-label="返回上一题">‹</button>
              <div>
                <p class="persona-kicker">人生体验画像</p>
                <h2 id="persona-title">找到下一段人生体验</h2>
              </div>
              <span class="persona-step-count" id="persona-step-count">1 / 6</span>
            </div>

            <div class="persona-progress" aria-hidden="true">
              <span id="persona-progress-bar"></span>
            </div>

            <div class="persona-hero-card" id="persona-hero-card">
              <div class="persona-illustration" aria-hidden="true">
                <span class="persona-sun"></span>
                <span class="persona-moon"></span>
                <span class="persona-path"></span>
                <span class="persona-person"></span>
              </div>
              <div>
                <p id="persona-section">开始之前</p>
                <strong id="persona-question">这不是测试你是谁，而是帮你找到下一段人生体验。</strong>
              </div>
            </div>

            <div class="persona-options" id="persona-options"></div>

            <div class="persona-actions">
              <button class="persona-secondary" type="button" id="persona-skip">稍后再测</button>
              <button class="persona-primary" type="button" id="persona-next">开始</button>
            </div>

            <p class="persona-ethics">本画像仅用于体验推荐与自我探索，不构成心理诊断或职业结论。</p>
          </div>

          <div class="persona-result hidden" id="persona-result">
            <div class="persona-result-art">
              <img
                id="persona-result-image"
                src="User_Profile/Reference/a.jpg"
                alt="职业人物画像拼贴"
              />
            </div>
            <p class="persona-kicker">阶段性画像</p>
            <h2 id="persona-result-title">慢热修复者</h2>
            <p id="persona-result-copy">建议先从舒适模式开始，选择手作、自然、低社交的体验项目。</p>
            <div class="persona-meter-list" id="persona-meter-list"></div>
            <div class="persona-mode-card">
              <span>推荐模式</span>
              <strong id="persona-mode-title">舒适模式</strong>
              <p id="persona-mode-copy">先恢复能量，再慢慢探索新的生活样本。</p>
            </div>
            <button class="persona-primary" type="button" id="persona-finish">进入我的体验推荐</button>
            <p class="persona-ethics">你可以随时重新测评或删除数据，画像不会作为职业结论。</p>
          </div>
        </section>

        <header class="topbar">
          <div>
            <p class="eyebrow">寻光计划</p>
            <h1>人生试衣间</h1>
          </div>
          <button class="icon-btn" type="button" aria-label="打开个人档案">◎</button>
        </header>

        <div class="section-loader" id="section-loader" aria-live="polite">加载中</div>
        <div
          class="section-mounts"
          id="section-mounts"
          data-sections="sections/today/index.html sections/assessment/index.html sections/experience/index.html sections/community/index.html"
        ></div>

        <nav class="tabbar" aria-label="主导航">
          <button class="active" type="button" data-go="home"><span>⌂</span>今日</button>
          <button type="button" data-go="coach"><span>◌</span>探索</button>
          <button type="button" data-go="experiences"><span>▦</span>体验</button>
          <button type="button" data-go="community"><span>◇</span>个人</button>
        </nav>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
